<p>Dials the phase-0 bridge and generates a real mesa remote-scry packet

<script type="module">
import { AmesWebTransportClient, webTransportOptions } from './ames-client.mjs';
import { AmesCometProofResponder } from './ames-comet-peer.mjs';
import {
  SUITE_B,
  bytesFromAtomLE,
  deriveAmesSymmetricKeyFromSuiteB,
  generateCometIdentity,
} from './ames-identity.mjs';
import { AmesIdentityStore } from './ames-identity-store.mjs';
import { AmesChumPeer, mesaFlowPath } from './ames-mesa-chum.mjs';
import { cometProofPath, signCometProofPage, verifyCometProofPage } from './ames-proof.mjs';
import { patp, patpToAtom } from './ames-ship.mjs';
import { bytesToHex, decodePact, encodePeek, hexToBytes } from './mesa-pact.mjs';
import { termAtom, tuple } from './urbit-noun.mjs';
import {
  bornOvumJam,
  keenOvumJam,
  loadMesaOvumJam,
  mateOvumJam,
  mesaHeerOvumJam,
} from './ames-wasm-events.mjs';
import { extractMesaEffects } from './ames-wasm-effects.mjs';
import { routeMesaEffects } from './ames-wasm-router.mjs';
import {
  BoundedPacketQueue,
  runQueuedWasmMesaLoop,
} from './ames-wasm-runtime-loop.mjs';
import {
  IndexedDBVereWasmFileStore,
  instantiateVereDiskWasmRuntime,
  runVereWasmProbe,
  runVereWasmProbeWithFileStore,
} from './vere-wasm-host.mjs';

const $ = id => document.getElementById(id);
const IDENTITY_STORE_KEY = 'default-comet';
const HOSTFS_STORE_SCOPE = 'demo-hostfs';
const MARS_EVENT_STORE_SCOPE = 'demo-mars-event-log';
const VERE_DISK_STORE_SCOPE = 'demo-vere-disk';
const wasmTextDecoder = new TextDecoder();
const log = (msg, cls='') => {
  const line = document.createElement('span');
  if (cls) line.className = cls;
  line.textContent = msg + '\n';
  $('log').append(line);
};
let client = null;
let identity = null;
const peers = new Map();
const identityStore = new AmesIdentityStore();

const parseAtom = text => {
  const raw = String(text ?? '').trim();
  if (!raw) throw new Error('atom is required');
  if (raw.startsWith('~')) return patpToAtom(raw);
  if (raw.startsWith('0x') || raw.startsWith('0X')) {
    return BigInt(`0x${raw.slice(2).replace(/[._]/g, '')}`);
  }
  return BigInt(raw.replace(/[._]/g, ''));
};

const parseUint = (text, name) => {
  const value = Number(parseAtom(text));
  if (!Number.isSafeInteger(value) || value < 0) {
    throw new Error(`${name} must be a non-negative safe integer`);
  }
  return value;
};

const parseMiB = (text, name) => {
  const value = parseUint(text, name);
  return value * 1024 * 1024;
};

const memoryOptionsFromForm = () => ({
  loomExponent: parseUint($('vere-disk-loom').value, 'vere disk WASM loom exponent'),
  overheadBytes: parseMiB($('vere-disk-overhead-mib').value, 'vere disk WASM overhead MiB'),
  maximumBytes: parseMiB($('vere-disk-maximum-mib').value, 'vere disk WASM maximum MiB'),
});

const bytesToMiB = bytes => Math.round(bytes / (1024 * 1024));

const parseFixedBytes = (text, length, name) => {
  const raw = String(text ?? '').trim();
  if (!raw) throw new Error(`${name} is required`);
  const compact = raw.replace(/\s+/g, '').replace(/[._]/g, '');
  if (
    !raw.startsWith('0x') &&
    !raw.startsWith('0X') &&
    /^[0-9a-fA-F]+$/.test(compact) &&
    compact.length === length * 2
  ) {
    return hexToBytes(compact);
  }
  return bytesFromAtomLE(parseAtom(raw), length);
};

const packetFromForm = () => {
  const hex = $('pkt').value.trim();
  if (hex) {
    return hexToBytes(hex);
  }

  return encodePeek({
    ship: parseAtom($('ship').value),
    path: $('path').value.trim(),
    rift: parseUint($('local-rift').value, 'source rift'),
  });
};

function chumInnerPaths() {
  const local = parseAtom($('ship').value);
  const remote = parseAtom($('chum-remote').value);
  const bone = parseAtom($('chum-bone').value);
  const sequence = parseAtom($('chum-seq').value);
  return {
    ackPath: $('chum-ack-path').value.trim() || mesaFlowPath({
      bone,
      load: 'ack',
      direction: 'bak',
      receiver: local,
      sequence,
    }),
    payloadPath: $('chum-payload-path').value.trim() || mesaFlowPath({
      bone,
      load: 'poke',
      direction: 'for',
      receiver: remote,
      sequence,
    }),
  };
}

async function deriveChumKeyFromPass(peerPass) {
  if (!identity?.ringBytes) {
    throw new Error('local suite-B ring is required; generate a comet identity first');
  }
  return deriveAmesSymmetricKeyFromSuiteB(identity, peerPass);
}

async function resolveChumKey({ required = false } = {}) {
  const keyText = $('chum-key').value.trim();
  if (!keyText) {
    const passText = $('chum-peer-pass').value.trim();
    if (passText) {
      const peerPass = parseFixedBytes(passText, SUITE_B.passBytes, 'chum peer suite-B pass');
      const derived = await deriveChumKeyFromPass(peerPass);
      $('chum-key').value = `0x${derived.toString(16)}`;
      log('derived chum symmetric key from local suite-B ring and peer pass', 'rx');
      return derived;
    }

    const remote = parseAtom($('chum-remote').value);
    const learned = peers.get(remote.toString());
    if (learned) {
      $('chum-remote-life').value = learned.life.toString();
      $('chum-peer-pass').value = bytesToHex(learned.passBytes);
      if (learned.key === undefined) {
        learned.key = await deriveChumKeyFromPass(learned.passBytes);
      }
      $('chum-key').value = `0x${learned.key.toString(16)}`;
      log(`using learned chum key for ${learned.shipPatp}`, 'rx');
      return learned.key;
    }

    if (required) throw new Error('chum symmetric key or peer suite-B pass is required');
    return undefined;
  }

  return parseAtom(keyText);
}

async function makeChumPeer(send, { required = false } = {}) {
  const key = await resolveChumKey({ required });
  if (key === undefined) {
    return null;
  }

  try {
    return new AmesChumPeer({
      key,
      local: parseAtom($('ship').value),
      localLife: parseAtom($('local-life').value),
      localRift: parseUint($('local-rift').value, 'source rift'),
      remote: parseAtom($('chum-remote').value),
      remoteLife: parseAtom($('chum-remote-life').value),
      remoteRift: parseUint($('chum-remote-rift').value, 'chum peer rift'),
      send,
      onPoke: opened => {
        log(`opened chum %poke ack=${opened.ack.innerPath} payload=${opened.payload.innerPath}`, 'rx');
        log(`opened chum plaintext ${opened.plaintextBytes.length}B: ${bytesToHex(opened.plaintextBytes)}`, 'rx');
        if (opened.gage !== undefined) {
          log(`opened chum gage: ${JSON.stringify(opened.gage, (_, value) => typeof value === 'bigint' ? value.toString() : value)}`, 'rx');
        }
      },
      onError: ({ type, error }) => {
        log(`${type}: ${error}`, 'err');
      },
    });
  } catch (e) {
    if (required) throw e;
    log('chum open disabled: ' + e, 'err');
    return null;
  }
}

async function learnCometProofPage(event) {
  const local = parseAtom($('ship').value);
  const localLife = parseAtom($('local-life').value);
  const learned = await verifyCometProofPage(event.packet, {
    receiver: local,
    receiverLife: localLife,
  });
  if (!learned) {
    return null;
  }

  let key;
  if (identity?.ringBytes) {
    key = await deriveChumKeyFromPass(learned.passBytes);
  }

  const record = {
    ...learned,
    key,
  };
  peers.set(learned.ship.toString(), record);
  $('chum-remote').value = learned.ship.toString();
  $('chum-remote-life').value = learned.life.toString();
  $('chum-peer-pass').value = bytesToHex(learned.passBytes);
  if (key !== undefined && !$('chum-key').value.trim()) {
    $('chum-key').value = `0x${key.toString(16)}`;
  }
  log(`learned comet peer ${learned.shipPatp} life ${learned.life.toString()} from proof page`, 'rx');
  return record;
}

function clearDerivedPeerKeys() {
  $('chum-key').value = '';
  for (const peer of peers.values()) {
    peer.key = undefined;
  }
}

function applyIdentity(nextIdentity, { restored = false } = {}) {
  identity = nextIdentity;
  $('ship').value = identity.comet.toString();
  clearDerivedPeerKeys();
  log(
    `${restored ? 'restored' : 'comet'}: ${identity.comet.toString()} sponsor ${identity.sponsor.toString()}`,
    'rx',
  );
  log(`suite-B pass bytes: ${bytesToHex(identity.passBytes)}`, 'rx');
}

async function restoreSavedIdentity() {
  try {
    const saved = await identityStore.load(IDENTITY_STORE_KEY);
    if (saved) {
      applyIdentity(saved, { restored: true });
    }
  } catch (e) {
    log('comet restore failed: ' + e, 'err');
  }
}

void restoreSavedIdentity();

$('comet').onclick = async () => {
  $('log').textContent = '';
  log('generating comet identity...');
  try {
    const nextIdentity = await generateCometIdentity({ retainRing: true });
    await identityStore.save(IDENTITY_STORE_KEY, nextIdentity);
    applyIdentity(nextIdentity);
    log('saved comet identity', 'rx');
  } catch (e) {
    log('comet generation failed: ' + e, 'err');
  }
};

const logWasmBytes = (bytes, cls = '') => {
  for (const raw of wasmTextDecoder.decode(bytes).replace(/\r/g, '').split('\n')) {
    const line = raw.trimEnd();
    if (line) log(`wasm: ${line}`, cls);
  }
};

function logMesaEffectSummary(label, bytes) {
  if (!bytes) {
    log(`${label} effects bytes=0; sends=0 mesa-pushes=0 binds=0 unknown=0`);
    return;
  }

  const effects = extractMesaEffects(bytes);
  log(
    `${label} effects bytes=${bytes.length}; ` +
    `sends=${effects.sends.length} mesa-pushes=${effects.pushes.length} ` +
    `binds=${effects.binds.length} unknown=${effects.unknown.length}`,
  );
}

const jsonLog = value => JSON.stringify(
  value,
  (_, item) => typeof item === 'bigint' ? item.toString() : item,
);

const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

async function routeWasmMesaEffects(label, bytes, opened) {
  if (!bytes) {
    return { sent: [], dropped: [] };
  }

  return routeMesaEffects(bytes, {
    sendLane: async (lane, packet) => {
      log(`${label}: route lane ${jsonLog(lane)} ${packet.length}B`);
      const mode = await opened.client.sendTo(lane, packet);
      log(`${label}: tx ${mode} ${packet.length}B: ${bytesToHex(packet)}`, 'tx');
      return mode;
    },
    onDrop: ({ lane, push }) => {
      log(`${label}: drop lane=${jsonLog(lane)} packet=${push.packet.length}B`, 'err');
    },
  });
}

$('forget-comet').onclick = async () => {
  $('log').textContent = '';
  try {
    await identityStore.forget(IDENTITY_STORE_KEY);
    identity = null;
    clearDerivedPeerKeys();
    log('forgot saved comet identity');
  } catch (e) {
    log('forget comet failed: ' + e, 'err');
  }
};

async function openClient({
  requireChum = false,
  learnProofs = true,
  onPacket = () => {},
} = {}) {
  const url = $('url').value.trim();
  if (client) {
    try {
      await client.close({ reason: 'new dial' });
    } catch (_) {}
  }

  const hash = $('hash').value.trim();
  let nextClient = null;
  let replyLane = null;
  let chumPeer = null;
  const sendReply = packet => {
    if (!replyLane) {
      throw new Error('cannot reply before receiving a UDP source lane');
    }
    return nextClient.sendTo(replyLane, packet);
  };
  const sendDefault = packet => {
    const galaxy = Number($('gateway-galaxy').value);
    if (!Number.isSafeInteger(galaxy) || galaxy < 0 || galaxy > 255) {
      throw new Error('gateway destination galaxy must be 0-255');
    }
    return nextClient.sendTo({ type: 'galaxy', ship: galaxy }, packet);
  };
  const nextResponder = new AmesCometProofResponder({
    getIdentity: () => identity,
    send: sendReply,
    onPacket: ({ mode, packet }) => {
      log(`rx ${mode} ${packet.length}B: ${bytesToHex(packet)}`, 'rx');
    },
    onProof: ({ mode, page, match }) => {
      log(
        `auto proof ${mode} ${page.pagePacket.length}B for ${match.receiverPatp}/${match.receiverLife}: ${bytesToHex(page.pagePacket)}`,
        'tx',
      );
    },
    onError: ({ type, error }) => {
      log(`${type}: ${error}`, 'err');
    },
  });
  chumPeer = await makeChumPeer(sendDefault, { required: requireChum });

  nextClient = new AmesWebTransportClient({
    url,
    options: webTransportOptions({ certificateHash: hash }),
    onStatus: status => {
      if (status.type === 'connecting') log('dialing ' + status.url + ' ...');
      if (status.type === 'open') log('session open', 'rx');
      if (status.type === 'closed' && !status.terminal) log('session closed');
    },
    onPacket: event => {
      replyLane = event.lane;
      onPacket(event);
      void nextResponder.handlePacket(event);
      if (learnProofs) {
        void learnCometProofPage(event).catch(error => {
          log(`peer proof learn failed: ${error}`, 'err');
        });
      }
      chumPeer?.handlePacket(event);
    },
    onError: ({ type, error }) => {
      log(`${type}: ${error}`, 'err');
    },
  });
  client = nextClient;
  return { client, chumPeer };
}

async function sendPacket(pkt, { override = false } = {}) {
  try {
    try {
      const pact = decodePact(pkt);
      log(`packet: %${pact.type} ${pact.name.path} as ship ${pact.name.ship.toString()}`);
    } catch (e) {
      if (!override) {
        throw e;
      }
      log('packet: raw override, codec parse skipped: ' + e);
    }
  } catch (e) {
    log('packet decode failed: ' + e, 'err');
    return;
  }

  const opened = await openClient();
  try {
    const galaxy = Number($('gateway-galaxy').value);
    if (!Number.isSafeInteger(galaxy) || galaxy < 0 || galaxy > 255) {
      throw new Error('gateway destination galaxy must be 0-255');
    }
    const mode = await opened.client.sendTo({ type: 'galaxy', ship: galaxy }, pkt);
    log(`tx ${mode} ${pkt.length}B: ${bytesToHex(pkt)}`, 'tx');
    log('sent — watching for response…');
  } catch (e) {
    log('send failed: ' + e, 'err');
  }
}

$('go').onclick = async () => {
  $('log').textContent = '';
  try {
    await sendPacket(packetFromForm(), { override: Boolean($('pkt').value.trim()) });
  } catch (e) {
    log('packet build failed: ' + e, 'err');
  }
};

$('proof').onclick = async () => {
  $('log').textContent = '';
  if (!identity) {
    log('generate a comet identity first', 'err');
    return;
  }

  try {
    const page = await signCometProofPage(identity, {
      receiver: parseAtom($('receiver').value),
      receiverLife: parseAtom($('receiver-life').value),
    });
    log(`proof path: ${page.path}`);
    log(`binding path: ${page.bindingPath}`);
    await sendPacket(page.pagePacket);
  } catch (e) {
    log('proof build failed: ' + e, 'err');
  }
};

$('peer-proof').onclick = async () => {
  $('log').textContent = '';
  try {
    const remote = parseAtom($('chum-remote').value);
    const local = parseAtom($('ship').value);
    const path = cometProofPath({
      receiverPatp: patp(local),
      receiverLife: parseAtom($('local-life').value),
    });
    $('path').value = path;
    await sendPacket(encodePeek({
      ship: remote,
      path,
      rift: parseUint($('chum-remote-rift').value, 'peer rift'),
    }));
  } catch (e) {
    log('peer proof request failed: ' + e, 'err');
  }
};

$('chum').onclick = async () => {
  $('log').textContent = '';
  try {
    const opened = await openClient({ requireChum: true });
    const paths = chumInnerPaths();
    const sent = await opened.chumPeer.sendPoke({
      ...paths,
      gage: tuple(termAtom('message'), termAtom('ack'), 0n),
    });
    log(`chum ack path: ${sent.ackPath}`);
    log(`chum payload path: ${sent.payloadPath}`);
    log(`tx ${sent.mode} ${sent.packet.length}B: ${bytesToHex(sent.packet)}`, 'tx');
    log('sent encrypted %chum %poke — watching for response…');
  } catch (e) {
    log('chum poke failed: ' + e, 'err');
  }
};

$('wasm-smoke').onclick = async () => {
  $('log').textContent = '';
  const wasmUrl = $('wasm-url').value.trim();
  try {
    log(`loading ${wasmUrl} ...`);
    const { exitCode, plan } = await runVereWasmProbe(wasmUrl, {
      memoryOptions: {
        loomExponent: 24,
        maximumBytes: 128 * 1024 * 1024,
      },
      onStdout: bytes => logWasmBytes(bytes, 'rx'),
      onStderr: bytes => logWasmBytes(bytes),
    });
    log(
      `wasm boot-lite exited ${exitCode}; initial=${plan.initialBytes} max=${plan.maximumBytes}`,
      exitCode === 0 ? 'rx' : 'err',
    );
  } catch (e) {
    log('wasm boot-lite failed: ' + e, 'err');
  }
};

$('ivory-smoke').onclick = async () => {
  $('log').textContent = '';
  const wasmUrl = $('ivory-wasm-url').value.trim();
  try {
    log(`loading ${wasmUrl} ...`);
    const { exitCode, plan } = await runVereWasmProbe(wasmUrl, {
      memoryOptions: {
        loomExponent: 26,
        overheadBytes: 256 * 1024 * 1024,
        maximumBytes: 512 * 1024 * 1024,
      },
      onStdout: bytes => logWasmBytes(bytes, 'rx'),
      onStderr: bytes => logWasmBytes(bytes),
    });
    log(
      `wasm ivory boot exited ${exitCode}; ` +
      `initial=${plan.initialBytes} max=${plan.maximumBytes}`,
      exitCode === 0 ? 'rx' : 'err',
    );
  } catch (e) {
    log('wasm ivory boot failed: ' + e, 'err');
  }
};

$('mars-smoke').onclick = async () => {
  $('log').textContent = '';
  const wasmUrl = $('mars-wasm-url').value.trim();
  try {
    log(`loading ${wasmUrl} ...`);
    const { exitCode, plan } = await runVereWasmProbe(wasmUrl, {
      memoryOptions: {
        loomExponent: 24,
        maximumBytes: 128 * 1024 * 1024,
      },
      onStdout: bytes => logWasmBytes(bytes, 'rx'),
      onStderr: bytes => logWasmBytes(bytes),
    });
    log(
      `wasm mars boot exited ${exitCode}; ` +
      `initial=${plan.initialBytes} max=${plan.maximumBytes}`,
      exitCode === 0 ? 'rx' : 'err',
    );
  } catch (e) {
    log('wasm mars boot failed: ' + e, 'err');
  }
};

async function runMarsRealPill({ runBoot = false, persistEvents = false } = {}) {
  $('log').textContent = '';
  const wasmUrl = $('mars-wasm-url').value.trim();
  const pillUrl = $('mars-pill-url').value.trim();
  try {
    log(`loading ${pillUrl} ...`);
    const response = await fetch(pillUrl);
    if (!response.ok) {
      throw new Error(`fetch pill failed: ${response.status}`);
    }
    const pillBytes = new Uint8Array(await response.arrayBuffer());
    log(`loaded brass pill ${pillBytes.length}B`);

    const memoryOptions = memoryOptionsFromForm();
    const baseOptions = {
      initialFiles: {
        '/brass.pill': pillBytes,
      },
      memoryOptions,
      onStdout: bytes => logWasmBytes(bytes, 'rx'),
      onStderr: bytes => logWasmBytes(bytes),
    };

    let exitCode;
    let plan;
    log(`loading ${wasmUrl} ...`);
    if (persistEvents) {
      const fileStore = new IndexedDBVereWasmFileStore({
        scope: MARS_EVENT_STORE_SCOPE,
      });
      await fileStore.clear();
      log('saving mars event log ...');
      const saved = await runVereWasmProbeWithFileStore(wasmUrl, {
        ...baseOptions,
        fileStore,
        args: ['--real-pill', '--save-events', '--loom', '29'],
      });
      log(
        `wasm mars event log save exited ${saved.exitCode}; ` +
        `initial=${saved.plan.initialBytes} max=${saved.plan.maximumBytes}`,
        saved.exitCode === 0 ? 'rx' : 'err',
      );
      if (saved.exitCode !== 0) {
        return;
      }

      log('loading mars event log ...');
      ({ exitCode, plan } = await runVereWasmProbeWithFileStore(wasmUrl, {
        ...baseOptions,
        fileStore,
        args: [
          '--real-pill',
          '--load-events',
          ...(runBoot ? ['--run-boot'] : []),
          '--loom',
          '29',
        ],
      }));
    } else {
      ({ exitCode, plan } = await runVereWasmProbe(wasmUrl, {
        ...baseOptions,
        args: [
          '--real-pill',
          ...(runBoot ? ['--run-boot'] : []),
          '--loom',
          '29',
        ],
      }));
    }

    log(
      `wasm mars ${runBoot ? 'full boot' : 'real pill'} exited ${exitCode}; ` +
      `initial=${plan.initialBytes} max=${plan.maximumBytes}`,
      exitCode === 0 ? 'rx' : 'err',
    );
  } catch (e) {
    log(`wasm mars ${runBoot ? 'full boot' : 'real pill'} failed: ` + e, 'err');
  }
};

$('mars-real-pill-smoke').onclick = () => runMarsRealPill();
$('mars-run-boot-smoke').onclick = () => runMarsRealPill({
  runBoot: true,
  persistEvents: true,
});

async function runVereDisk({
  runBoot = false,
  pokeLoadMesa = false,
  peekHeer = false,
  keen = false,
  routeMesa = false,
} = {}) {
  $('log').textContent = '';
  const wasmUrl = $('vere-disk-wasm-url').value.trim();
  const pillUrl = $('mars-pill-url').value.trim();
  try {
    log(`loading ${pillUrl} ...`);
    const response = await fetch(pillUrl);
    if (!response.ok) {
      throw new Error(`fetch pill failed: ${response.status}`);
    }
    const pillBytes = new Uint8Array(await response.arrayBuffer());
    log(`loaded brass pill ${pillBytes.length}B`);

    const fileStore = new IndexedDBVereWasmFileStore({
      scope: VERE_DISK_STORE_SCOPE,
    });
    await fileStore.clear();

    const memoryOptions = memoryOptionsFromForm();
    const ovumPath = '/in/load-mesa.ovum.jam';
    const loadEffectsPath = '/out/load-mesa.effects.jam';
    const bornPath = '/in/born.ovum.jam';
    const bornEffectsPath = '/out/born.effects.jam';
    const heerPath = '/in/peek-heer.ovum.jam';
    const heerEffectsPath = '/out/peek-heer.effects.jam';
    const matePath = '/in/mate.ovum.jam';
    const mateEffectsPath = '/out/mate.effects.jam';
    const keenPath = '/in/keen.ovum.jam';
    const keenEffectsPath = '/out/keen.effects.jam';
    const injectBorn = keen;
    const injectMate = keen;
    const injectMesa = pokeLoadMesa || peekHeer || keen;
    const fakeShip = keen ? parseAtom($('ship').value) : 0n;
    const runtimeArgs = [
      '--loom',
      String(memoryOptions.loomExponent),
      ...(fakeShip === 0n ? [] : ['--fake-ship', fakeShip.toString()]),
    ];
    const peekPacket = encodePeek({
      ship: parseAtom($('ship').value),
      path: $('path').value.trim(),
      rift: parseUint($('local-rift').value, 'source rift'),
    });
    const keenPeer = parseAtom($('receiver').value);
    const keenScryPath = $('path').value.trim().startsWith('/~')
      ? '/c/x/1/kids/sys/kelvin'
      : $('path').value.trim();
    const baseOptions = {
      fileStore,
      initialFiles: {
        '/brass.pill': pillBytes,
        ...(injectMesa ? { [ovumPath]: loadMesaOvumJam() } : {}),
        ...(injectBorn ? { [bornPath]: bornOvumJam() } : {}),
        ...(peekHeer ? { [heerPath]: mesaHeerOvumJam({ packet: peekPacket }) } : {}),
        ...(injectMate ? { [matePath]: mateOvumJam({ ship: keenPeer }) } : {}),
        ...(keen ? { [keenPath]: keenOvumJam({ ship: keenPeer, path: keenScryPath }) } : {}),
      },
      memoryOptions,
      onStdout: bytes => logWasmBytes(bytes, 'rx'),
      onStderr: bytes => logWasmBytes(bytes),
    };

    log(`loading ${wasmUrl} ...`);
    log(
      `memory plan: --loom ${memoryOptions.loomExponent}, ` +
      `overhead=${bytesToMiB(memoryOptions.overheadBytes)}MiB ` +
      `max=${bytesToMiB(memoryOptions.maximumBytes)}MiB`,
    );

    if (routeMesa) {
      let runtime = null;
      try {
        log('starting resident vere disk runtime ...');
        runtime = await instantiateVereDiskWasmRuntime(wasmUrl, {
          ...baseOptions,
          initialFiles: {
            '/brass.pill': pillBytes,
          },
        });
        runtime.init({
          loomExponent: memoryOptions.loomExponent,
          ship: fakeShip,
        });
        log(
          `wasm vere disk resident initialized event=${runtime.event()}; ` +
          `initial=${runtime.plan.initialBytes} max=${runtime.plan.maximumBytes}`,
          'rx',
        );

        runtime.pokeLoadMesa({ effectsPath: loadEffectsPath });
        log(
          `wasm vere disk resident load mesa event=${runtime.event()}`,
          'rx',
        );
        runtime.host.files.set(bornPath, bornOvumJam());
        runtime.pokeOvum({
          ovumPath: bornPath,
          effectsPath: bornEffectsPath,
        });
        log(`wasm vere disk resident born event=${runtime.event()}`, 'rx');
        runtime.host.files.set(matePath, mateOvumJam({ ship: keenPeer }));
        runtime.pokeOvum({
          ovumPath: matePath,
          effectsPath: mateEffectsPath,
        });
        log(`wasm vere disk resident mate event=${runtime.event()}`, 'rx');
        runtime.host.files.set(keenPath, keenOvumJam({
          ship: keenPeer,
          path: keenScryPath,
        }));
        runtime.pokeOvum({
          ovumPath: keenPath,
          effectsPath: keenEffectsPath,
        });
        log(`wasm vere disk resident keen event=${runtime.event()}`, 'rx');

        logMesaEffectSummary('mesa-load', runtime.host.files.get(loadEffectsPath));
        logMesaEffectSummary('mesa-born', runtime.host.files.get(bornEffectsPath));
        const mateEffectsBytes = runtime.host.files.get(mateEffectsPath);
        const keenEffectsBytes = runtime.host.files.get(keenEffectsPath);
        logMesaEffectSummary('mesa-mate', mateEffectsBytes);
        logMesaEffectSummary('mesa-keen', keenEffectsBytes);

        const inboundPackets = new BoundedPacketQueue({
          maxPackets: 32,
          onDrop: () => log('dropped inbound WebTransport packet', 'err'),
        });
        log('routing Mesa %push effects over WebTransport ...');
        const opened = await openClient({
          learnProofs: false,
          onPacket: ({ packet }) => {
            inboundPackets.push(packet);
          },
        });
        const mateRoutes = await routeWasmMesaEffects(
          'mesa-mate',
          mateEffectsBytes,
          opened,
        );
        const keenRoutes = await routeWasmMesaEffects(
          'mesa-keen',
          keenEffectsBytes,
          opened,
        );
        log(
          `routed Mesa pushes sent=${mateRoutes.sent.length + keenRoutes.sent.length} ` +
          `dropped=${mateRoutes.dropped.length + keenRoutes.dropped.length}`,
        );

        const loop = await runQueuedWasmMesaLoop({
          queue: inboundPackets,
          maxRounds: 4,
          idleRoundsToStop: 3,
          firstDelayMs: 3000,
          delayMs: 3000,
          delay,
          onIdle: ({ rounds, idleRounds }) => {
            log(
              `WebTransport reply loop idle after ${rounds} rounds ` +
              `idle=${idleRounds}`,
            );
          },
          onRoundStart: ({ round, packets }) => {
            log(
              `captured WebTransport replies round=${round} ` +
              `count=${packets.length}`,
            );
          },
          runBatch: async ({ startIndex, packets }) => {
            const effects = [];
            log('injecting WebTransport replies into resident WASM as %heer ...');

            for (const [index, packet] of packets.entries()) {
              const replyIndex = startIndex + index;
              const ovumPath = `/in/reply-${replyIndex}.ovum.jam`;
              const effectsPath = `/out/reply-${replyIndex}.effects.jam`;
              runtime.host.files.set(ovumPath, mesaHeerOvumJam({ packet }));
              runtime.pokeOvum({
                ovumPath,
                effectsPath,
              });
              effects.push({
                label: `mesa-reply-${replyIndex}`,
                effectsBytes: runtime.host.files.get(effectsPath),
              });
            }

            log(
              `wasm vere disk resident replies applied event=${runtime.event()}; ` +
              `initial=${runtime.plan.initialBytes} max=${runtime.plan.maximumBytes}`,
              'rx',
            );
            return { ok: true, effects };
          },
          routeEffects: async ({ label, effectsBytes }) => {
            logMesaEffectSummary(label, effectsBytes);
            return routeWasmMesaEffects(label, effectsBytes, opened, {
              sessionRoutes,
            });
          },
          onRoundComplete: ({ round, sent, dropped }) => {
            log(
              `reply round ${round} routed Mesa pushes ` +
              `sent=${sent} dropped=${dropped}`,
            );
          },
        });

        log(
          `WebTransport reply loop complete packets=${loop.packets} ` +
          `dropped-inbound=${loop.droppedInbound} queued=${loop.queued} ` +
          `stopped=${loop.stoppedBy}`,
        );
        if (loop.droppedInbound) {
          log(`dropped inbound WebTransport packets=${loop.droppedInbound}`, 'err');
        }
        sessionRoutes.unregisterSession(1n);
        await opened.client.close({ reason: 'route smoke complete' });

        await runtime.save();
        runtime.shutdown();
        runtime = null;

        log('replaying runtime event from resident vere disk pier ...');
        const replayed = await runVereWasmProbeWithFileStore(wasmUrl, {
          ...baseOptions,
          args: [...runtimeArgs, '--load-only', '--run-boot'],
        });
        log(
          `wasm vere disk replay exited ${replayed.exitCode}; ` +
          `initial=${replayed.plan.initialBytes} max=${replayed.plan.maximumBytes}`,
          replayed.exitCode === 0 ? 'rx' : 'err',
        );
        return;
      } finally {
        if (runtime) {
          try {
            runtime.shutdown();
          } catch (e) {
            log('resident vere disk shutdown failed: ' + e, 'err');
          }
        }
      }
    }

    log('saving vere disk pier ...');
    const saved = await runVereWasmProbeWithFileStore(wasmUrl, {
      ...baseOptions,
      args: runtimeArgs,
    });
    log(
      `wasm vere disk save exited ${saved.exitCode}; ` +
      `initial=${saved.plan.initialBytes} max=${saved.plan.maximumBytes}`,
      saved.exitCode === 0 ? 'rx' : 'err',
    );
    if (saved.exitCode !== 0) {
      return;
    }

    const persisted = await fileStore.load();
    const eventLog = persisted.files.get('/pier/.urb/log/0i0/events.bin');
    const meta = persisted.files.get('/pier/.urb/log/meta.bin');
    log(`persisted event log bytes=${eventLog?.length ?? 0}`);
    log(`persisted metadata bytes=${meta?.length ?? 0}`);

    log(
      `loading vere disk pier${runBoot || injectMesa ? ' and booting' : ''}` +
      `${injectMesa ? ' with %load %mesa' : ''}` +
      `${peekHeer ? ' and %heer packet' : ''}` +
      `${keen ? ' and %mate/%keen request' : ''} ...`,
    );
    const loaded = await runVereWasmProbeWithFileStore(wasmUrl, {
      ...baseOptions,
      args: [
        ...runtimeArgs,
        '--load-only',
        ...(runBoot || injectMesa ? ['--run-boot'] : []),
        ...(injectMesa
          ? ['--poke-ovum', ovumPath, '--effects-out', loadEffectsPath]
          : []),
        ...(injectBorn
          ? ['--poke-ovum', bornPath, '--effects-out', bornEffectsPath]
          : []),
        ...(peekHeer
          ? ['--poke-ovum', heerPath, '--effects-out', heerEffectsPath]
          : []),
        ...(injectMate
          ? ['--poke-ovum', matePath, '--effects-out', mateEffectsPath]
          : []),
        ...(keen
          ? ['--poke-ovum', keenPath, '--effects-out', keenEffectsPath]
          : []),
      ],
    });
    log(
      `wasm vere disk ${
        keen ? 'keen' : peekHeer ? 'mesa packet' : pokeLoadMesa ? 'load mesa' : runBoot ? 'full boot' : 'load'
      } exited ${loaded.exitCode}; ` +
      `initial=${loaded.plan.initialBytes} max=${loaded.plan.maximumBytes}`,
      loaded.exitCode === 0 ? 'rx' : 'err',
    );
    if (injectMesa) {
      logMesaEffectSummary('mesa-load', loaded.host.files.get(loadEffectsPath));
    }
    if (injectBorn) {
      logMesaEffectSummary('mesa-born', loaded.host.files.get(bornEffectsPath));
    }
    if (peekHeer) {
      logMesaEffectSummary('mesa-packet', loaded.host.files.get(heerEffectsPath));
    }
    const mateEffectsBytes = loaded.host.files.get(mateEffectsPath);
    const keenEffectsBytes = loaded.host.files.get(keenEffectsPath);
    if (injectMate) {
      logMesaEffectSummary('mesa-mate', mateEffectsBytes);
    }
    if (keen) {
      logMesaEffectSummary('mesa-keen', keenEffectsBytes);
    }

    if (routeMesa && loaded.exitCode === 0) {
      const inboundPackets = new BoundedPacketQueue({
        maxPackets: 32,
        onDrop: () => log('dropped inbound WebTransport packet', 'err'),
      });
      log('routing Mesa %push effects over WebTransport ...');
      const opened = await openClient({
        learnProofs: false,
        onPacket: ({ packet }) => {
          inboundPackets.push(packet);
        },
      });
      const mateRoutes = injectMate
        ? await routeWasmMesaEffects('mesa-mate', mateEffectsBytes, opened)
        : { sent: [], dropped: [] };
      const keenRoutes = keen
        ? await routeWasmMesaEffects('mesa-keen', keenEffectsBytes, opened)
        : { sent: [], dropped: [] };
      log(
        `routed Mesa pushes sent=${mateRoutes.sent.length + keenRoutes.sent.length} ` +
        `dropped=${mateRoutes.dropped.length + keenRoutes.dropped.length}`,
      );

      const loop = await runQueuedWasmMesaLoop({
        queue: inboundPackets,
        maxRounds: 4,
        firstDelayMs: 3000,
        delayMs: 1000,
        delay,
        onIdle: ({ rounds }) => {
          log(`WebTransport reply loop idle after ${rounds} rounds`);
        },
        onRoundStart: ({ round, packets }) => {
          log(
            `captured WebTransport replies round=${round} ` +
            `count=${packets.length}`,
          );
        },
        runBatch: async ({ startIndex, packets }) => {
          const replyFiles = Object.fromEntries(
            packets.map((packet, index) => [
              `/in/reply-${startIndex + index}.ovum.jam`,
              mesaHeerOvumJam({ packet }),
            ]),
          );
          const replyArgs = packets.flatMap((_, index) => [
            '--poke-ovum',
            `/in/reply-${startIndex + index}.ovum.jam`,
            '--effects-out',
            `/out/reply-${startIndex + index}.effects.jam`,
          ]);

          log('injecting WebTransport replies back into WASM as %heer ...');
          const heard = await runVereWasmProbeWithFileStore(wasmUrl, {
            ...baseOptions,
            initialFiles: {
              ...baseOptions.initialFiles,
              ...replyFiles,
            },
            args: [
              ...runtimeArgs,
              '--load-only',
              '--run-boot',
              ...replyArgs,
            ],
          });
          log(
            `wasm vere disk replies exited ${heard.exitCode}; ` +
            `initial=${heard.plan.initialBytes} max=${heard.plan.maximumBytes}`,
            heard.exitCode === 0 ? 'rx' : 'err',
          );

          return {
            ok: heard.exitCode === 0,
            effects: packets.map((_, index) => {
              const replyIndex = startIndex + index;
              return {
                label: `mesa-reply-${replyIndex}`,
                effectsBytes: heard.host.files.get(
                  `/out/reply-${replyIndex}.effects.jam`,
                ),
              };
            }),
          };
        },
        routeEffects: async ({ label, effectsBytes }) => {
          logMesaEffectSummary(label, effectsBytes);
          return routeWasmMesaEffects(label, effectsBytes, opened, {
            sessionRoutes,
          });
        },
        onRoundComplete: ({ round, sent, dropped }) => {
          log(
            `reply round ${round} routed Mesa pushes ` +
            `sent=${sent} dropped=${dropped}`,
          );
        },
      });

      log(
        `WebTransport reply loop complete packets=${loop.packets} ` +
        `dropped-inbound=${loop.droppedInbound} queued=${loop.queued} ` +
        `stopped=${loop.stoppedBy}`,
      );
      if (loop.droppedInbound) {
        log(`dropped inbound WebTransport packets=${loop.droppedInbound}`, 'err');
      }
    }

    if (injectMesa && loaded.exitCode === 0) {
      log('replaying runtime event from vere disk pier ...');
      const replayed = await runVereWasmProbeWithFileStore(wasmUrl, {
        ...baseOptions,
        args: [...runtimeArgs, '--load-only', '--run-boot'],
      });
      log(
        `wasm vere disk replay exited ${replayed.exitCode}; ` +
        `initial=${replayed.plan.initialBytes} max=${replayed.plan.maximumBytes}`,
        replayed.exitCode === 0 ? 'rx' : 'err',
      );
    }
  } catch (e) {
    log(
      `wasm vere disk ${
        keen ? 'keen' : peekHeer ? 'mesa packet' : pokeLoadMesa ? 'load mesa' : runBoot ? 'full boot' : 'load'
      } failed: ` + e,
      'err',
    );
  }
}

$('vere-disk-smoke').onclick = () => runVereDisk();
$('vere-disk-run-boot-smoke').onclick = () => runVereDisk({ runBoot: true });
$('vere-disk-load-mesa-smoke').onclick = () => runVereDisk({
  pokeLoadMesa: true,
});
$('vere-disk-peek-heer-smoke').onclick = () => runVereDisk({
  peekHeer: true,
});
$('vere-disk-keen-smoke').onclick = () => runVereDisk({
  keen: true,
});
$('vere-disk-keen-route-smoke').onclick = () => runVereDisk({
  keen: true,
  routeMesa: true,
});

$('hostfs-smoke').onclick = async () => {
  $('log').textContent = '';
  const wasmUrl = $('hostfs-wasm-url').value.trim();
  try {
    const store = new IndexedDBVereWasmFileStore({
      scope: HOSTFS_STORE_SCOPE,
    });
    await store.clear();
    log(`loading ${wasmUrl} ...`);
    const { exitCode, plan } = await runVereWasmProbeWithFileStore(wasmUrl, {
      fileStore: store,
      initialFiles: {
        '/in': 'ames!',
      },
      memoryOptions: {
        loomExponent: 20,
        overheadBytes: 64 * 1024,
        minimumInitialBytes: 16 * 1024 * 1024,
        maximumBytes: 32 * 1024 * 1024,
      },
      onStdout: bytes => logWasmBytes(bytes, 'rx'),
      onStderr: bytes => logWasmBytes(bytes),
    });
    const persisted = await store.load();
    const outFile = wasmTextDecoder.decode(
      persisted.files.get('/out') ?? new Uint8Array(),
    );
    const ok = exitCode === 0 &&
      outFile === 'quic' &&
      persisted.directories.has('/tmp') &&
      persisted.files.has('/random') === false;
    log(
      `/out=${outFile} ` +
      `/tmp=${persisted.directories.has('/tmp')} ` +
      `/random=${persisted.files.has('/random')}`,
    );
    log(
      `wasm hostfs exited ${exitCode}; initial=${plan.initialBytes} max=${plan.maximumBytes}`,
      ok ? 'rx' : 'err',
    );
  } catch (e) {
    log('wasm hostfs failed: ' + e, 'err');
  }
};
